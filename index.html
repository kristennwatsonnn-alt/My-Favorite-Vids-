
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Collection</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 30px 16px;
  font-family: Arial, sans-serif;
  background: #f7f7f7;
  color: #222;
}
header {
  text-align: center;
  margin-bottom: 30px;
}
h1 { font-size: 28px; }
header p { color: #777; }
.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 22px;
  max-width: 1050px;
  margin: auto;
}
.card {
  background: white;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 3px 12px #00000012;
}
.card a { color: inherit; text-decoration: none; }
.card img {
  width: 100%;
  display: block;
  aspect-ratio: 16/9;
  object-fit: cover;
}
.card h2 {
  font-size: 16px;
  padding: 0 14px;
}
.card p {
  color: #777;
  padding: 0 14px 12px;
  font-size: 13px;
}
</style>
</head>
<body>

<header>
<h1>Video Collection</h1>
<p>Tap any video to watch on YouTube</p>
</header>

<div class="gallery" id="gallery"></div>

<script>
const videos = [
  {id:"mdpFyyYzJHA", title:"Video 1"},
  {id:"daFnEiLEx70", title:"Video 2"},
  {id:"CZZEp8EaO6g", title:"Video 3"},
  {id:"3591R8Tpud8", title:"Video 4"},
  {id:"UzZbMj5qYNg", title:"Video 5"},
  {id:"r8Itm0Pxjdc", title:"Video 6"},
  {id:"-6S3puowOu4", title:"Video 7"},
  {id:"Cbbb31ab1So", title:"Video 8"},
  {id:"HkMCYae7ua4", title:"Video 9"}
];

document.getElementById("gallery").innerHTML =
videos.map((video, index) => `
  <div class="card">
    <a href="https://youtu.be/${video.id}" target="_blank" rel="noopener">
      <img src="https://img.youtube.com/vi/${video.id}/hqdefault.jpg"
           alt="${video.title}">
      <h2>${video.title}</h2>
      <p>▶ Watch on YouTube</p>
    </a>
  </div>
`).join("");
</script>

</body>
</html>
